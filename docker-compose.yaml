name: bbs-marvel

x-python: &python
  build:
    context: .
    dockerfile: Dockerfile.python
  image: cc7261/bbs-python

x-csharp: &csharp
  build:
    context: .
    dockerfile: Dockerfile.csharp
  image: cc7261/bbs-csharp

x-cpp: &cpp
  build:
    context: .
    dockerfile: Dockerfile.cpp
  image: cc7261/bbs-cpp

x-java: &java
  build:
    context: .
    dockerfile: Dockerfile.java
  image: cc7261/bbs-java

services:
  broker:
    <<: *python
    command: ["python", "broker.py"]

  proxy:
    <<: *python
    command: ["python", "proxy.py"]

  reference:
    <<: *python
    command: ["python", "reference.py"]

  homem-de-ferro-python-1:
    <<: *python
    command: ["python", "server.py"]
    environment: {SERVER_NAME: homem-de-ferro-python-1, CLOCK_SKEW: "3.0"}
    volumes: ["./data/homem-de-ferro-python-1:/data"]
    depends_on: [broker, proxy, reference]
  maquina-de-combate-python-2:
    <<: *python
    command: ["python", "server.py"]
    environment: {SERVER_NAME: maquina-de-combate-python-2, CLOCK_SKEW: "-2.0"}
    volumes: ["./data/maquina-de-combate-python-2:/data"]
    depends_on: [broker, proxy, reference]

  capitao-america-java-1:
    <<: *java
    command: ["java", "-cp", "classes:lib/*", "bbs.Servidor"]
    environment: {SERVER_NAME: capitao-america-java-1, CLOCK_SKEW: "-3.5"}
    volumes: ["./data/capitao-america-java-1:/data"]
    depends_on: [broker, proxy, reference]
  soldado-invernal-java-2:
    <<: *java
    command: ["java", "-cp", "classes:lib/*", "bbs.Servidor"]
    environment: {SERVER_NAME: soldado-invernal-java-2, CLOCK_SKEW: "0.5"}
    volumes: ["./data/soldado-invernal-java-2:/data"]
    depends_on: [broker, proxy, reference]

  viuva-negra-csharp-1:
    <<: *csharp
    command: ["dotnet", "Bbs.dll", "server"]
    environment: {SERVER_NAME: viuva-negra-csharp-1, CLOCK_SKEW: "2.5"}
    volumes: ["./data/viuva-negra-csharp-1:/data"]
    depends_on: [broker, proxy, reference]
  gaviao-arqueiro-csharp-2:
    <<: *csharp
    command: ["dotnet", "Bbs.dll", "server"]
    environment: {SERVER_NAME: gaviao-arqueiro-csharp-2, CLOCK_SKEW: "-1.0"}
    volumes: ["./data/gaviao-arqueiro-csharp-2:/data"]
    depends_on: [broker, proxy, reference]

  visao-cpp-1:
    <<: *cpp
    command: ["bbs-server"]
    environment: {SERVER_NAME: visao-cpp-1, CLOCK_SKEW: "1.5"}
    volumes: ["./data/visao-cpp-1:/data"]
    depends_on: [broker, proxy, reference]
  feiticeira-escarlate-cpp-2:
    <<: *cpp
    command: ["bbs-server"]
    environment: {SERVER_NAME: feiticeira-escarlate-cpp-2, CLOCK_SKEW: "-4.0"}
    volumes: ["./data/feiticeira-escarlate-cpp-2:/data"]
    depends_on: [broker, proxy, reference]

  client-python-1:
    <<: *python
    command: ["python", "client.py"]
    environment: {BOT_NAME: homem-de-ferro-python-1}
    depends_on: [broker, proxy, reference]
  client-python-2:
    <<: *python
    command: ["python", "client.py"]
    environment: {BOT_NAME: maquina-de-combate-python-2}
    depends_on: [broker, proxy, reference]
  client-java-1:
    <<: *java
    command: ["java", "-cp", "classes:lib/*", "bbs.Cliente"]
    environment: {BOT_NAME: capitao-america-java-1}
    depends_on: [broker, proxy, reference]
  client-java-2:
    <<: *java
    command: ["java", "-cp", "classes:lib/*", "bbs.Cliente"]
    environment: {BOT_NAME: soldado-invernal-java-2}
    depends_on: [broker, proxy, reference]
  client-csharp-1:
    <<: *csharp
    command: ["dotnet", "Bbs.dll", "client"]
    environment: {BOT_NAME: viuva-negra-csharp-1}
    depends_on: [broker, proxy, reference]
  client-csharp-2:
    <<: *csharp
    command: ["dotnet", "Bbs.dll", "client"]
    environment: {BOT_NAME: gaviao-arqueiro-csharp-2}
    depends_on: [broker, proxy, reference]
  client-cpp-1:
    <<: *cpp
    command: ["bbs-client"]
    environment: {BOT_NAME: visao-cpp-1}
    depends_on: [broker, proxy, reference]
  client-cpp-2:
    <<: *cpp
    command: ["bbs-client"]
    environment: {BOT_NAME: feiticeira-escarlate-cpp-2}
    depends_on: [broker, proxy, reference]
