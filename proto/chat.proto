syntax = "proto3";

option java_package = "bbs";
option java_outer_classname = "ChatProto";
option csharp_namespace = "Bbs";

enum Tipo {
  DESCONHECIDO = 0;
  LOGIN = 1;
  LISTAR_CANAIS = 2;
  CRIAR_CANAL = 3;
  PUBLICAR = 4;
  PUBLICACAO = 5;
  OBTER_RANK = 6;
  LISTAR_SERVIDORES = 7;
  BATIMENTO = 8;
  ELEICAO = 9;
  RELOGIO = 10;
  COORDENADOR = 11;
  REPLICAR = 12;
  SINCRONIZAR = 13;
}

enum Status {
  STATUS_NAO_DEFINIDO = 0;
  OK = 1;
  ERRO = 2;
}

message InfoServidor {
  string nome = 1;
  int32 rank = 2;
  string endereco = 3;
}

message EntradaLog {
  string id = 1;
  string origem = 2;
  string tipo = 3;
  double instante = 4;
  int64 relogio = 5;
  string usuario = 6;
  string canal = 7;
  string texto = 8;
}

message Envelope {
  Tipo tipo = 1;
  string remetente = 2;
  double instante = 3;
  Status status = 4;
  string erro = 5;
  string usuario = 6;
  string canal = 7;
  repeated string canais = 8;
  string texto = 9;
  int64 relogio = 10;
  int32 rank = 11;
  repeated InfoServidor servidores = 12;
  double hora = 13;
  string coordenador = 14;
  string endereco = 15;
  repeated EntradaLog entradas = 16;
}
